[pytest]
# Configuration pytest pour pdf-dispatch
testpaths = tests
# test_python_core.py is a standalone runner (python3 tests/test_python_core.py,
# it calls sys.exit) and is therefore not collected by pytest.
python_files = test_api.py test_webhook.py test_auth.py test_blank_split.py test_ssrf.py test_hardening.py
python_classes = Test
python_functions = test_

# Affichage verbeux par défaut
addopts = -v --tb=short

# Masquer les warnings pytest internes
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
